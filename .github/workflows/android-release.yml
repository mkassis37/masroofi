name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: |
          pnpm check
          pnpm test

      - name: Build Android APK with EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait

      - name: Download APK from EAS
        shell: bash
        run: |
          mkdir -p release
          npx eas-cli@latest build:list --platform android --status finished --limit 1 --json > release/build.json
          node -e 'const fs=require("fs"); const builds=JSON.parse(fs.readFileSync("release/build.json","utf8")); const url=builds[0]?.artifacts?.buildUrl; if(!url) throw new Error("No finished APK artifact found"); fs.writeFileSync("release/build-url.txt", url);'
          curl -L --fail --retry 3 "$(cat release/build-url.txt)" -o "release/masroofi-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact for main builds
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: masroofi-apk-${{ github.sha }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release and upload APK for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: مصروفي ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
