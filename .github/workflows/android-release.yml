name: Masroofi Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: masroofi-auto-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: |
          pnpm check
          pnpm test
          pnpm lint

      - name: Validate EAS secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "Missing EXPO_TOKEN"; exit 1; }
          test -n "$EAS_PROJECT_ID" || { echo "Missing EAS_PROJECT_ID"; exit 1; }

      - name: Generate automatic release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Unique, chronological release version for every successful push build.
          VERSION="v$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Android APK with EAS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > release/build.json

      - name: Download and verify APK
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('release/build.json','utf8'));
          const builds = Array.isArray(data) ? data : [data];
          const build = builds.find(x => x?.status === 'FINISHED' && x?.artifacts?.buildUrl);
          if (!build) throw new Error('EAS did not produce a finished Android APK');
          fs.writeFileSync('release/build-url.txt', build.artifacts.buildUrl);
          NODE

          APK="release/masroofi-${VERSION}.apk"
          curl --fail --location --retry 3 --retry-all-errors \
            "$(cat release/build-url.txt)" \
            -o "$APK"

          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" > release/SHA256SUMS.txt

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: masroofi-${{ steps.version.outputs.version }}
          path: |
            release/*.apk
            release/SHA256SUMS.txt
          retention-days: 14

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="release/masroofi-${VERSION}.apk"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

          gh release create "$VERSION" \
            "$APK" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "مصروفي $VERSION" \
            --generate-notes \
            --latest
