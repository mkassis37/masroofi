name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve EAS project for minaskamal1s-team
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p release
          project_id="${EAS_PROJECT_ID:-}"
          if [[ ! "$project_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            set +e
            raw="$(EAS_PROJECT_ID= npx eas-cli@latest project:init --account minaskamal1s-team --json --non-interactive 2>&1)"
            eas_status=$?
            set -e
            printf '%s\n' "$raw" > release/project-info.txt
            if [[ "$eas_status" -ne 0 ]]; then
              echo "EAS could not link or initialize finance-tracker for minaskamal1s-team. Details:"
              cat release/project-info.txt
              exit "$eas_status"
            fi
            project_id="$(printf '%s' "$raw" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => (input += chunk));
              process.stdin.on("end", () => {
                try {
                  const parsed = JSON.parse(input);
                  const id = parsed.id ?? parsed.projectId ?? parsed.project?.id ?? "";
                  process.stdout.write(String(id));
                } catch {
                  const match = input.match(/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/);
                  process.stdout.write(match?.[0] ?? "");
                }
              });
            ')"
          fi
          if [[ ! "$project_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Could not resolve a valid EAS project ID for owner minaskamal1s-team and slug finance-tracker."
            cat release/project-info.txt
            exit 1
          fi
          echo "EAS_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          echo "Resolved EAS project ID for the configured team (value hidden)."

      - name: Validate project
        run: |
          if [[ ! "$EAS_PROJECT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "EAS_PROJECT_ID must be a valid UUID secret for minaskamal1s-team."
            exit 1
          fi
          pnpm check
          pnpm test
          pnpm lint

      - name: Build Android APK with EAS
        shell: bash
        run: |
          mkdir -p release
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > release/build.json

      - name: Download APK from EAS
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("release/build.json", "utf8").trim();
          let build;
          try {
            build = JSON.parse(raw);
          } catch {
            throw new Error(`EAS did not return valid JSON. Output begins with: ${raw.slice(0, 500)}`);
          }
          const builds = Array.isArray(build) ? build : [build];
          const finished = builds.find((item) => item?.status === "FINISHED" && item?.artifacts?.buildUrl);
          if (!finished) {
            throw new Error(`EAS build did not finish successfully: ${JSON.stringify(builds[0])}`);
          }
          fs.writeFileSync("release/build-id.txt", finished.id ?? "unknown");
          fs.writeFileSync("release/build-url.txt", finished.artifacts.buildUrl);
          NODE
          curl -L --fail --retry 3 "$(cat release/build-url.txt)" -o "release/masroofi-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact for main builds
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: masroofi-apk-${{ github.sha }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release and upload APK for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          apk="release/masroofi-${RELEASE_TAG}.apk"

          # The release may already exist if a previous upload was interrupted.
          # Reuse it and upload the asset with retries instead of failing on a
          # transient HTML/5xx response from GitHub's upload endpoint.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for attempt in 1 2 3 4 5; do
              if gh release create "$RELEASE_TAG" "$apk" \
                --repo "$GITHUB_REPOSITORY" \
                --title "مصروفي $RELEASE_TAG" \
                --generate-notes; then
                exit 0
              fi
              echo "Release creation/upload attempt $attempt failed; retrying..."
              sleep 15
            done
            echo "Unable to create GitHub Release after 5 attempts."
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber; then
              exit 0
            fi
            echo "Release asset upload attempt $attempt failed; retrying..."
            sleep 15
          done
          echo "Unable to upload APK asset after 5 attempts."
          exit 1
