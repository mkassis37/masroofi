name: Android Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: |
          pnpm check
          pnpm test
          pnpm lint

      - name: Build Android APK with EAS
        shell: bash
        run: |
          mkdir -p release
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > release/build.json

      - name: Download APK from EAS
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("release/build.json", "utf8").trim();
          let build;
          try {
            build = JSON.parse(raw);
          } catch {
            throw new Error(`EAS did not return valid JSON. Output begins with: ${raw.slice(0, 500)}`);
          }
          const builds = Array.isArray(build) ? build : [build];
          const finished = builds.find((item) => item?.status === "FINISHED" && item?.artifacts?.buildUrl);
          if (!finished) {
            throw new Error(`EAS build did not finish successfully: ${JSON.stringify(builds[0])}`);
          }
          fs.writeFileSync("release/build-id.txt", finished.id ?? "unknown");
          fs.writeFileSync("release/build-url.txt", finished.artifacts.buildUrl);
          NODE
          curl -L --fail --retry 3 "$(cat release/build-url.txt)" -o "release/masroofi-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact for main builds
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: masroofi-apk-${{ github.sha }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release and upload APK for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: مصروفي ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.apk
